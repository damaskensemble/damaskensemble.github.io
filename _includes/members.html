<div class="members">
  {% for m in site.members %}
  <div class="member">
    {% if m.photo %}<div class="member__portrait"><img src="{{ m.photo | relative_url }}" alt="{{ m.name }}"></div>{% endif %}
    <p class="member__name">{{ m.name }}</p>
    <p class="member__voice">{{ m.voice }}</p>
  </div>
  {% endfor %}
</div>
