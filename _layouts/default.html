<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}, {{ site.tagline }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/damask-live-theme.css' | relative_url }}">
  <link rel="icon" href="data:,">
  {% feed_meta %}
  {% seo %}
</head>
<body>
  <header class="site-header damask-motif">
    <div class="wrap site-header__inner">
      <a href="{{ '/' | relative_url }}" style="text-decoration:none;">
        <p class="site-title">{{ site.title }}</p>
      </a>
      <p class="site-tagline">{{ site.tagline }}</p>
      {% include nav.html %}
    </div>
  </header>

  <main>
    <div class="wrap">
      {{ content }}
    </div>
  </main>

  {% include footer.html %}
</body>
</html>
